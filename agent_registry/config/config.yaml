server:
  protocol: http2
  addr: "192.168.50.104:8500"          # HTTP/2 (h2, TLS + ALPN)
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120
  max_handlers: 1000
  max_concurrent_streams: 250
  max_read_frame_size: 1048576
  tls:
    enabled: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    auto_cert: false
    domains: []

database:
  driver: postgres
  dsn: "postgres://mcpadm:Mephisto80@192.168.50.201:5433/mcp?sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  auto_migrate: true

ollama:
  host: "http://192.168.50.104:11434"   # model catalog 探測來源（/api/tags + /api/show）

logger:
  level: info
  output: stdout
  colors: true
