server:
  protocol: http2
  addr: "192.168.50.104:8502"          # HTTP/2 (h2, TLS + ALPN)
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120
  max_handlers: 1000
  max_concurrent_streams: 250
  max_read_frame_size: 1048576
  tls:
    enabled: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    auto_cert: false
    domains: []

# ── BGE-M3 Embedding 服務 ─────────────────────────────────────────────────────
embedding:
  backend: ollama                                  # ollama | tei
  base_url: "http://192.168.50.201:11434"          # BGE-M3 server
  model: "bge-m3"                                  # Ollama tag
  dimension: 1024                                  # BGE-M3 dense 維度
  timeout: 60s
  max_batch_size: 32

# ── Cassandra 5.0 (dense vector storage with SAI ANN) ────────────────────────
cassandra:
  hosts:
    - "192.168.50.201:9042"
  keyspace: "mcp"
  username: "mcpadm"
  password: "qwert77142"
  consistency: "LOCAL_ONE"
  timeout: 5s
  num_conns: 2
  auto_init: true                                  # 啟動時建立 chunks_dense 表

# ── Redis 快取（embedding 結果，避免重複呼叫 BGE-M3）─────────────────────────
redis:
  addr: "192.168.50.201:6379"
  password: "Mephisto80"
  db: 0
  cache_ttl: 24h                                   # embedding 快取 TTL
  enabled: true

# ── PostgreSQL（hybrid search 用；不啟用時 hybrid endpoint 回 503） ──────────
postgres:
  enabled: true
  dsn: "postgres://mcpadm:Mephisto80@192.168.50.201:5433/mcp?sslmode=disable"
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime: 30m
  connect_timeout: 5s

# ── Hybrid Search（dense ANN + sparse + RRF Fusion） ─────────────────────────
# 2026-05-08：BGE-M3 sparse 向量路徑放棄（Ollama backend 不出 sparse）。
# sparse_strategy 只剩兩個有意義的值：
#   "fts" — PG full-text search（to_tsvector，不需 sparse 向量資料）
#   "nop" — 完全不查 sparse；hybrid 結果等同 dense-only
hybrid:
  enabled: true
  dense_top_n: 20                                  # Cassandra ANN 撈取數量
  sparse_top_n: 20                                 # sparse 撈取數量（fts 用）
  final_top_k: 5                                   # RRF 融合後最終回傳
  rrf_k: 60                                        # RRF 公式 k 常數
  min_score: 0                                     # 0 = 不過濾
  sparse_strategy: "nop"                           # nop | fts

# ── Event Bus（v2 架構：Redis Stream，與 Redis 共用連線） ─────────────────────
eventbus:
  enabled: true
  stream_upserted: "embedding.upserted"            # upsert 完成事件
  stream_searched: "embedding.searched"            # search 完成事件
  stream_deleted:  "embedding.deleted"             # 刪除事件
  max_len: 10000                                   # 環形緩衝；舊事件自動丟棄
  publish_timeout: 1s                              # 單筆 XADD 超時

logger:
  level: info
  output: stdout
  colors: true
