server:
  protocol: http2
  addr: "192.168.50.104:8503"          # HTTP/2 (h2, TLS + ALPN)
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120
  keep_alive: 30s
  max_handlers: 1000
  max_concurrent_streams: 250
  max_read_frame_size: 1048576
  tls:
    enabled: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    auto_cert: false
    domains: []

grpc:
  addr: "192.168.50.104:8511"          # CriticService gRPC；供 agents 服務呼叫，沿用 HTTP server 的憑證
  # ── dev_pub_0.9 內部 mTLS（部署時啟用；dev 留空 = 舊行為單向 TLS）──
  # ca_file 非空即要求並驗證呼叫端 client cert（RequireAndVerifyClientCert）
  ca_file: ""                       # 例 "certs/internal-ca.crt"
  allowed_client_cns: []            # 例 ["agents"]；mTLS 啟用時空清單 = 拒絕全部
  trusted_ips: []                   # dev_090 內網通道：例 ["192.168.50.103"]，命中即免憑證/免 Key 放行

database:
  driver: postgres
  dsn: "postgres://mcpadm:Mephisto80@192.168.50.201:5433/mcp?sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  auto_migrate: true
  redis:
    addr: "192.168.50.201:6379"
    password: "Mephisto80"
    db: 0

critic:
  pass_threshold: 0.7
  weights:
    completeness: 0.4
    grounding: 0.3
    faithfulness: 0.3

logger:
  level: info
  output: stdout
  format: json
  colors: false
