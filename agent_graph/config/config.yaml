server:
  protocol: http2
  addr: "192.168.50.104:8504"          # HTTP/2 (h2, TLS + ALPN)
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120
  keep_alive: 30s
  max_handlers: 1000
  max_concurrent_streams: 250
  max_read_frame_size: 1048576
  tls:
    enabled: true
    cert_file: "certs/server.crt"
    key_file: "certs/server.key"
    auto_cert: false
    domains: []

grpc:
  addr: "192.168.50.104:8512"          # GraphService gRPC；供 agents 服務的 graph_query 工具呼叫
  # ── dev_pub_0.9 內部 mTLS（部署時啟用；dev 留空 = 舊行為單向 TLS）──
  # ca_file 非空即要求並驗證呼叫端 client cert（RequireAndVerifyClientCert）
  ca_file: ""                       # 例 "certs/internal-ca.crt"
  allowed_client_cns: []            # 例 ["agents", "agent_gateway"]；mTLS 啟用時空清單 = 拒絕全部
  trusted_ips: []                   # dev_090 內網通道：例 ["192.168.50.103"]，命中即免憑證/免 Key 放行

# 獨立於共用 PG（192.168.50.201）之外的實例——Apache AGE 對 PG 主版本綁定較緊，
# 用獨立 instance 隔離風險、方便單獨升級。連線帳密請依實際環境調整。
database:
  driver: postgres
  dsn: "postgres://mcpadm:Mephisto80@192.168.50.201:5433/mcp?sslmode=disable"
  max_idle_conns: 10
  max_open_conns: 100
  auto_migrate: true
  redis:
    addr: ""
    password: ""
    db: 0

graph:
  # 後端固定為 embedded Kùzu（AGE/pgvector 路徑已於 2026-07-08 移除）
  kuzu_path: "data/graph.kz" # 相對 agent_graph 執行目錄
  embedding_dim: 1024        # BGE-M3
  confidence_threshold: 0.75 # LLM 抽取的關係達此信心才自動 MERGE；否則進 proposed_relations 待審

logger:
  level: info
  output: stdout
  format: json
  colors: false
