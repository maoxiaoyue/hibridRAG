syntax = "proto3";

package agent.v1;

option go_package = "agent/app/models;models";

// AgentService 提供外部 agent 連線入口。
// Inbound: 由上游 API (內部服務) 推送訊息進來，Unary ack。
// 本 agent 作為下游推送端時，使用 OutboundMsg 作為輸出契約
// (實作為 client 呼叫對端的 Inbound)。
service AgentService {
  rpc Inbound(InboundReq) returns (InboundAck);

  // ---- dev_pub_0.9：供 agent_gateway 轉發 client 流量的同步介面 ----
  // Chat 對應 REST /api/chat 的 ChatSync 語意（client tools / continuation 全保留）。
  rpc Chat(ChatTurnReq) returns (ChatTurnResp);
  // UploadIngest 文件攝取上傳：首則訊息帶 meta，後續訊息帶檔案 chunk（≤64KB/則）。
  rpc UploadIngest(stream UploadChunk) returns (UploadAck);
  // GetIngestJob 輪詢攝取任務狀態。
  rpc GetIngestJob(IngestJobReq) returns (IngestJobResp);
}

// ---- 核心訊息結構 ----

message Message {
  string role = 1;      // "system" | "user" | "assistant" | "tool"
  string content = 2;
}

message Metadata {
  string model = 1;
  double temperature = 2;
  bool stream = 3;
}

// AgentReq 為外部 agent 連線時的第一個核心請求載體。
message AgentReq {
  string session_id = 1;
  string user_id = 2;
  string agent_id = 3;
  repeated Message messages = 4;
  Metadata metadata = 5;
}

// AgentResp 為核心回應載體 (保留給未來同步/串流回應用途)。
message AgentResp {
  string session_id = 1;
  string delta = 2;
  bool done = 3;
  string finish_reason = 4;
  int32 code = 5;
  string error = 6;
}

// ---- Inbound: 上游 → 本 agent ----

message InboundReq {
  string trace_id = 1;    // 跨服務追蹤 ID
  string from = 2;        // 來源服務 / agent 識別
  AgentReq payload = 3;   // 核心訊息載體
}

message InboundAck {
  string trace_id = 1;
  string message_id = 2;  // 本 agent 指派的訊息 ID
  bool accepted = 3;
  int32 code = 4;         // 0=ok, 400=invalid, 502=downstream unreachable, 504=timeout
  string error = 5;
}

// ---- dev_pub_0.9：Chat / UploadIngest / GetIngestJob ----
// schema / args 用 JSON 字串傳遞（client 端本來就以 json.RawMessage 持有，
// 免去 google.protobuf.Struct 的雙向轉換）。

message ChatToolSpec {
  string name = 1;
  string description = 2;
  string schema_json = 3;  // JSON Schema 原文
}

message ChatToolCall {
  string id = 1;
  string name = 2;
  string args_json = 3;    // JSON object 原文
}

message ChatToolResult {
  string tool_call_id = 1;
  string name = 2;
  string content = 3;
  bool is_error = 4;
}

message TokenUsage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message ChatTurnReq {
  string agent_id = 1;
  string session_id = 2;
  repeated Message messages = 3;              // 重用核心 Message {role, content}
  repeated ChatToolSpec client_tools = 4;
  string continuation_id = 5;
  repeated ChatToolResult tool_results = 6;
  float temperature = 7;
}

message ChatTurnResp {
  string status = 1;          // "final" | "tool_calls"
  string content = 2;
  string session_id = 3;
  string continuation_id = 4;
  repeated ChatToolCall tool_calls = 5;
  TokenUsage usage = 6;
}

message UploadMeta {
  string agent_id = 1;
  repeated string tags = 2;
}

// UploadChunk client-streaming：第一則只帶 meta，後續帶 file_name + data。
// 同一檔案可拆多則 chunk（file_name 相同即續寫）。
message UploadChunk {
  UploadMeta meta = 1;
  string file_name = 2;
  bytes data = 3;
}

message UploadAck {
  string job_id = 1;
  string status = 2;
}

message IngestJobReq {
  string job_id = 1;
}

message IngestJobResp {
  string id = 1;
  string status = 2;
  int32 total_chunks = 3;
  int32 done_chunks = 4;
  string error = 5;
}

// ---- Outbound: 本 agent → 下游 agent ----

// OutboundMsg 為本 agent 推送訊息給下游 agent 時的契約。
// 實作上由本 agent 作為 gRPC client 呼叫對端的 Inbound，
// 將 OutboundMsg 映射為對端的 InboundReq (payload + from + trace_id)。
message OutboundMsg {
  string trace_id = 1;
  string from = 2;        // 本 agent ID
  string to = 3;          // 目標 agent ID / service endpoint
  string direction = 4;   // "forward" | "reply" | "broadcast"
  AgentReq payload = 5;   // 重用核心訊息載體
}
