syntax = "proto3";

package agent_graph.v1;

option go_package = "agent_graph/pb/graphpb;graphpb";

import "google/protobuf/struct.proto";

// GraphService 提供 Apache AGE 知識圖譜的查詢/寫入介面。
// 呼叫方為 agents 服務的 graph_query 工具（A2 Researcher 與 A4 Knowledge Agent
// 的協作介面），比照 agent_critic 的 gRPC 接線模式。
service GraphService {
  rpc SearchEntities(SearchEntitiesReq) returns (SearchEntitiesResp);
  rpc GetLocalContext(LocalContextReq) returns (LocalContextResp);
  rpc ExecuteCypher(ExecuteCypherReq) returns (ExecuteCypherResp);
  rpc HybridSearch(HybridSearchReq) returns (HybridSearchResp);
  rpc ProposeRelation(ProposeRelationReq) returns (ProposeRelationResp);

  // ---- dev_pub_0.9：proposed_relations 人工審核（供 agent_gateway 轉發 client 流量）----
  // 注意：agents 的 graph_query 工具刻意不包這三個 RPC——審核是人工 UI 流程，
  // 不給 LLM 工具用；只有帶有效 API Key 的 client 經 gateway 可達。
  rpc ListProposed(ListProposedReq) returns (ListProposedResp);
  rpc ApproveProposed(ReviewProposedReq) returns (ProposedRelationMsg);
  rpc RejectProposed(ReviewProposedReq) returns (ProposedRelationMsg);

  // ---- vault 檔案下載（pub_client「Sync Vault」）----
  rpc VaultManifest(VaultManifestReq) returns (VaultManifestResp);
  rpc VaultFetch(VaultFetchReq) returns (stream VaultFileChunk);
}

message Entity {
  string name = 1;
  string category = 2;
  string description = 3;
  string source_file = 4;
  double score = 5;  // 混合搜尋時填入向量相似度；純圖遍歷時為 0
  int32 degree = 6;  // 全圖關係數（client 用來決定節點大小/關鍵節點）
}

message Relation {
  string source = 1;
  string target = 2;
  string type = 3;
}

message SearchEntitiesReq {
  string query = 1;
  int32 limit = 2; // 預設 10
}
message SearchEntitiesResp {
  repeated Entity entities = 1;
}

message LocalContextReq {
  string entity_name = 1;
  int32 hops = 2;  // 預設 1，上限 4
  int32 limit = 3; // 預設 20
}
message LocalContextResp {
  Entity center = 1;
  repeated Entity neighbors = 2;
  repeated Relation relations = 3;
}

// ExecuteCypher 是設計文件的「execute_cypher」逃生艙口——供內部工具/除錯用，
// 呼叫端需自行保證 query 的正確性（本服務不對查詢文字做語意檢查）。
message ExecuteCypherReq {
  string query = 1;
  google.protobuf.Struct params = 2;
  repeated string columns = 3; // 對應 RETURN 子句的欄位名，用來解析 agtype 型別
}
message ExecuteCypherResp {
  repeated google.protobuf.Struct rows = 1;
}

message HybridSearchReq {
  string query = 1; // 自然語言查詢，內部先算 embedding 再找種子實體
  int32 top_k = 2;  // 種子實體數量，預設 5
  int32 hops = 3;   // 每個種子的圖遍歷深度，預設 1
}
message HybridSearchResp {
  repeated Entity seeds = 1;
  repeated LocalContextResp context = 2;
}

// ProposeRelation 供 Obsidian 同步之外的呼叫端（例如 agents 的 Episodic 學習
// 迴圈）提交低信心關係候選，走跟同步 worker 一致的「低信心待審」路徑。
message ProposeRelationReq {
  string source_entity = 1;
  string target_entity = 2;
  string relation_type = 3;
  double confidence = 4;
  string source_file = 5;
  string extracted_by = 6;
}
message ProposeRelationResp {
  string id = 1;
  string status = 2;
}

// ---- dev_pub_0.9：待審關係審核 ----

message ProposedRelationMsg {
  string id = 1;
  string source_entity = 2;
  string target_entity = 3;
  string relation_type = 4;
  double confidence = 5;
  string source_file = 6;
  string extracted_by = 7;
  string status = 8;      // pending | approved | rejected
  string created_at = 9;  // RFC3339
}

message ListProposedReq {
  string status = 1; // 空 = "pending"
  int32 limit = 2;   // <=0 → 50，上限 200
}
message ListProposedResp {
  repeated ProposedRelationMsg relations = 1;
}

message ReviewProposedReq {
  string id = 1;
}

// ---- vault 檔案下載 ----

message VaultManifestReq {}

message VaultFileInfo {
  string path = 1;          // vault 相對路徑（forward slash）
  int64 size = 2;
  string sha256 = 3;
  int64 modified_unix = 4;
}
message VaultManifestResp {
  repeated VaultFileInfo files = 1;
}

message VaultFetchReq {
  repeated string paths = 1; // manifest 回傳的相對路徑
}

// VaultFileChunk 一個檔案切成多則 chunk（≤64KB）串流傳輸；每檔最後跟一則
// eof=true 的空 chunk 作結。
message VaultFileChunk {
  string path = 1;
  bytes data = 2;
  bool eof = 3;
}
